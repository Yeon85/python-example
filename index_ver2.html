<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍 파이썬 입문 강의</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
      background-color: #f4f6f8;
      font-size: 15px;
    }
    header {
      background-color: #3f51b5;
      color: white;
      padding: 1.2rem;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .layout {
      display: flex;
      flex-direction: row;
      min-height: 100vh;
    }
    .tabs {
      width: 220px;
      background-color: #3f51b5;
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      color: white;
    }
    .tab {
      padding: 0.8rem 1rem;
      cursor: pointer;
      border-left: 5px solid transparent;
      transition: all 0.2s ease;
    }
    .tab:hover {
      background-color: #5c6bc0;
    }
    .tab.active {
      background-color: #ffffff;
      color: #3f51b5;
      font-weight: bold;
      border-left: 5px solid #3f51b5;
    }
    .tab-content-area {
      flex: 1;
      background-color: white;
      padding: 2rem 3rem;
      overflow-y: auto;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    pre {
      background: #f1f1f1;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
    }
    ul li, ol li {
      margin-bottom: 6px;
    }
    a { color: #1a0dab; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>📘 정연주의 파이썬 입문 강의</header>
  <div class="layout">
    <div class="tabs" id="tabList"></div>
    <div class="tab-content-area" id="tabContents"></div>
  </div>
  <script>
    const chapters = [
      { title: "🐍 Chapter 1", subtitle: "파이썬 설치하기", content: `
        <h2>🐍 Chapter 1. 파이썬 설치하기</h2>
        <ul>
          <li>🔗 <a href='https://www.python.org/downloads/' target='_blank'>공식 웹사이트에서 다운로드</a></li>
          <li>✅ 설치 시 "Add Python to PATH" 체크</li>
          
          <li>💡 IDLE 또는 명령 프롬프트로 실행 가능</li>
          <li>🗂️ 파일 탐색기 → 보기 → ✅ <b>확장자명 보기</b>, ✅ <b>숨긴 항목 보기</b> 체크</li>
        </ul>` },
      { title: "💻 Chapter 2", subtitle: "파이썬 시작하기", content: `

          <ul>
            <li>➕ 2-1. 계산하기: <code>print(3 + 5)</code></li>
            <li>📝 2-2. 문자열 출력: <code>print("Hello")</code></li>
            <li>📅 2-3. 캘린더 출력:
              <pre>import calendar\nprint(calendar.month(2020, 1))\nprint(calendar.prcal(2020))</pre>
              <p>아래는 실제 IDLE 실행 화면 예시입니다.</p>
              <img src="/mnt/images/process.png" alt="IDLE calendar 실행 예시" class="screenshot" />
            </li>
            <li>🛠️ 2-4. 프로그래밍 준비: IDLE 실행, CMD 사용법</li>
            <li>📄 2-5. 프로그래밍 작성: .py 파일 생성 및 실행</li>
            <li>🔡 2-6. 입출력 명령어: <code>input()</code>, <code>print()</code></li>
            <li>🧠 2-7. 프로그램 작성 흐름: 계획 → 코딩 → 테스트</li>
        </ul>` },
      { title: "🧠 Chapter 3", subtitle: "프로그래밍 기초", content: `
        <h2>🧠 Chapter 3. 프로그래밍 기초</h2>
        <ul>
          <li>🔣 변수와 자료형 (숫자, 문자, 리스트 등)</li>
          <li>🧾 조건문 if, elif, else</li>
          <li>🔁 반복문 for, while</li>
        </ul>` },
      { title: "📦 Chapter 4", subtitle: "import 사용법", content: `
        <h2>📦 Chapter 4. import 사용법</h2>
        <pre>import math\nprint(math.sqrt(16))\n\nimport random\nprint(random.randint(1, 10))</pre>` },
      { title: "🎮 Chapter 5", subtitle: "CUI 미니게임", content: `
        <h2>🎮 Chapter 5. CUI로 미니 게임 만들기</h2>
        <pre>import random\nnum = random.randint(1, 10)\nguess = int(input("숫자 입력: "))\nif guess == num:\n  print("정답!")\nelse:\n  print("틀렸습니다. 정답은", num)</pre>` },
      { title: "🖼️ Chapter 6", subtitle: "GUI 기초 1", content: `
        <h2>🖼️ Chapter 6. GUI 기초 1</h2>
        <pre>import tkinter as tk\nroot = tk.Tk()\nlabel = tk.Label(root, text="Hello GUI")\nlabel.pack()\nroot.mainloop()</pre>` },
      { title: "🧩 Chapter 7", subtitle: "GUI 기초 2", content: `
        <h2>🧩 Chapter 7. GUI 기초 2</h2>
        <pre>import tkinter as tk\ndef say_hello():\n  label.config(text="안녕하세요!")\n\nroot = tk.Tk()\nlabel = tk.Label(root, text="")\nlabel.pack()\nbtn = tk.Button(root, text="클릭", command=say_hello)\nbtn.pack()\nroot.mainloop()</pre>` },
      { title: "🕹️ Chapter 8", subtitle: "게임 개발 기술", content: `<h2>🕹️ Chapter 8. 기본적인 게임 개발 기술</h2><ul><li>🧱 충돌 감지</li><li>⏱️ 시간 제어</li><li>🎮 키보드 이벤트 처리</li></ul>` },
      { title: "🧊 Chapter 9", subtitle: "블록 낙하 게임", content: `<h2>🧊 Chapter 9. 블록 낙하 게임 만들기</h2><p>테트리스 스타일 게임 만들기 연습</p>` },
      { title: "🎲 Chapter 10", subtitle: "Pygame 사용법", content: `<h2>🎲 Chapter 10. Pygame 사용법</h2><ul><li>설치: <code>pip install pygame</code></li><li>기본 구조: 화면, 이벤트 루프, 그리기</li></ul>` },
      { title: "⚔️ Chapter 11", subtitle: "RPG 만들기 1", content: `<h2>⚔️ Chapter 11. 본격 RPG 만들기 -1</h2><ul><li>캐릭터 이동</li><li>맵 구성</li><li>충돌 처리</li></ul>` },
      { title: "🛡️ Chapter 12", subtitle: "RPG 만들기 2", content: `<h2>🛡️ Chapter 12. 본격 RPG 만들기 -2</h2><ul><li>전투 시스템</li><li>아이템 관리</li><li>체력바 구현</li></ul>` },
      { title: "🏗️ Chapter 13", subtitle: "객체 지향 프로그래밍", content: `<h2>🏗️ Chapter 13. 객체 지향 프로그래밍</h2><ul><li>클래스 & 인스턴스</li><li>상속과 캡슐화</li><li>다형성</li></ul>` }
    ];

    const tabList = document.getElementById('tabList');
    const tabContents = document.getElementById('tabContents');

    chapters.forEach((ch, index) => {
      const tab = document.createElement('div');
      tab.className = 'tab' + (index === 0 ? ' active' : '');
      tab.innerHTML = `${ch.title}<br><small>${ch.subtitle}</small>`;
      tab.onclick = (e) => changeTab(e, 'panel' + index);
      tabList.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'tab-panel' + (index === 0 ? ' active' : '');
      panel.id = 'panel' + index;
      panel.innerHTML = ch.content;
      tabContents.appendChild(panel);
    });

    function changeTab(e, panelId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

      e.currentTarget.classList.add('active');
      document.getElementById(panelId).classList.add('active');
    }
  </script>
</body>
</html>
